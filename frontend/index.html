<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoCine AI</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo">GC</span><div><strong>GeoCine AI</strong><small>Селфи · Контент · Кино</small></div></div>
    <label>Кто вы</label>
    <select id="kind">
      <option value="selfie">Селфи</option>
      <option value="content">Блогер</option>
      <option value="film">Кино / клип</option>
      <option value="investment">Инвестор</option>
    </select>
    <label>Что ищете</label>
    <textarea id="query" rows="3">Улочки со зданиями 18-19 века</textarea>
    <label>Эпоха архитектуры</label>
    <select id="epoch">
      <option value="">По тексту запроса</option>
      <option value="medieval">Средневековье / крепость</option>
      <option value="baroque">Барокко</option>
      <option value="classicism">Классицизм</option>
      <option value="empire">Ампир</option>
      <option value="eclectic">Эклектика / XIX век</option>
      <option value="art_nouveau">Модерн</option>
      <option value="wooden">Деревянный город</option>
      <option value="constructivism">Конструктивизм</option>
      <option value="stalinist">Сталинский ампир</option>
    </select>
    <label>Тариф</label>
    <select id="plan">
      <option value="free">Free</option>
      <option value="creator">Creator</option>
      <option value="studio">Studio</option>
    </select>
    <button id="analyze" type="button">Найти локации</button>
    <button id="studios" type="button" class="ghost">Студии и павильоны</button>
    <button id="invest" type="button" class="ghost">Инвест-анализ</button>
    <p class="hint">Эпоху можно выбрать или написать словами в запросе.</p>
    <div id="quota" class="parsed"></div>
    <div id="parsed" class="parsed"></div>
    <div id="results" class="results"></div>
  </aside>
  <main><header><h1>Location Scout</h1><span id="status">загрузка…</span></header><div id="map"></div></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/assets/app.js"></script>
</body></html>
